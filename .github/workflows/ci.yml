name: CI Pipeline

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: final_project

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_URL: jdbc:mysql://localhost:3306/final_project?allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: root
      DB_PASSWORD: root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      - name: Create database table
        run: |
          mysql -h 127.0.0.1 -u root -proot final_project <<EOF
          CREATE TABLE IF NOT EXISTS contact_us (
              id INT AUTO_INCREMENT PRIMARY KEY,
              first_name VARCHAR(100),
              last_name VARCHAR(100),
              email VARCHAR(150),
              message VARCHAR(255)
          );
          EOF

      - name: Run tests
        run: mvn clean test -Dci_cd=true -Dbrowser=chrome

      - name: Upload ChainTest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaintest-report
          path: target/chaintest/